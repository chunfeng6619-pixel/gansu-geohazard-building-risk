name: Verify archived research results
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/audit_archive.py
      - run: python scripts/reproduce_fragility_bounds.py
      - run: python scripts/check_local_sensitivity.py
      - run: python scripts/reproduce_annual_example.py --with-sobol
