[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gansu-geohazard-building-risk"
version = "1.0.1"
description = "Research code and supporting numerical data for Gansu landslide susceptibility and rural-building fragility analysis"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]
license = {text = "MIT (code); see DATA_LICENSES.md for data"}
authors = [{name = "Hao Wang"}, {name = "Chen Shi"}, {name = "Yawei Li"}, {name = "Hongrong Ma"}]

[tool.setuptools.packages.find]
where = ["src"]
